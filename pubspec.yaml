name: primeflix_app
description: PrimeFlix - native Android streaming app (ExoPlayer, HEVC/DASH).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  better_player_plus: ^1.4.1      # 1.4.0+ adds R8/Proguard consumer rules; needs Dart 3.11 / Flutter 3.41+
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.0
  shimmer: ^3.0.0
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: assets/icon/icon_fg.png
