name: Build PrimeFlix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Clean Android and regenerate
      run: |
        rm -rf android
        flutter create --org com.primeflix --project-name primeflix_app --platforms=android .
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Release APK
      run: |
        flutter build apk --release 2>&1 | tee build.log; echo "EXIT:${PIPESTATUS[0]}"
      continue-on-error: true
      
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: primeflix-apk
        path: build/app/outputs/flutter-apk/app-release.apk
