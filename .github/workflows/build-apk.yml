name: Build PrimeFlix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Clean Android and regenerate
      run: |
        rm -rf android
        flutter create --org com.primeflix --project-name primeflix_app --platforms=android .
        
    - name: Add permissions to Manifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        # Add INTERNET permission before <application> tag
        sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' "$MANIFEST"
        echo "=== Manifest permissions ==="
        grep -A2 "uses-permission" "$MANIFEST" | head -5
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build Release APK
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: primeflix-apk
        path: build/app/outputs/flutter-apk/app-release.apk
